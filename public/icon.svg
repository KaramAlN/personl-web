<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E234E"/>
      <stop offset="60%" stop-color="#070B1F"/>
      <stop offset="100%" stop-color="#030510"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep space background rounded container -->
  <rect width="512" height="512" rx="112" fill="url(#spaceGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22D3EE" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="#22D3EE" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="12 8" transform="rotate(-28 256 256)"/>
  <ellipse cx="256" cy="256" rx="200" ry="90" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.3" transform="rotate(32 256 256)"/>

  <!-- Orbiting Satellites -->
  <circle cx="395" cy="180" r="10" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="115" cy="330" r="7" fill="#818CF8" filter="url(#glow)"/>

  <!-- Center Core Hexagonal Shield -->
  <polygon points="256,120 360,180 360,300 256,360 152,300 152,180" fill="#070B1F" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Monogram KN & AI Node Constellation -->
  <text x="256" y="275" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">KN</text>

  <!-- Subtitle -->
  <text x="256" y="325" font-family="monospace" font-size="20" fill="#22D3EE" font-weight="bold" text-anchor="middle" letter-spacing="6">AI &bull; SPACE APPS</text>

  <!-- Corner Status Pulse -->
  <circle cx="430" cy="82" r="8" fill="#22D3EE" filter="url(#glow)"/>
</svg>
